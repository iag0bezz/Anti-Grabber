name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tray-ui dependencies
        working-directory: tray-ui
        run: npm ci --foreground-scripts

      - name: Verify Electron binary
        shell: pwsh
        working-directory: tray-ui
        run: |
          if (-not (Test-Path "node_modules\electron\dist\electron.exe")) {
            Write-Host "electron.exe ausente após npm ci — rodando install.js de novo..."
            node node_modules\electron\install.js
          }
          if (-not (Test-Path "node_modules\electron\dist\electron.exe")) {
            throw "electron.exe continua ausente depois do retry — falha real no download."
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set tray-ui package version
        working-directory: tray-ui
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build installer
        shell: pwsh
        run: .\scripts\build-installer.ps1 -Configuration Release -Version "${{ steps.version.outputs.version }}"

      - name: Hash installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\installer\AntiGrabberSetup.exe" -Algorithm SHA256).Hash
          "$hash  AntiGrabberSetup.exe" | Out-File "dist\installer\AntiGrabberSetup.exe.sha256" -Encoding ascii

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/installer/AntiGrabberSetup.exe
            dist/installer/AntiGrabberSetup.exe.sha256
            dist/installer/AntiGrabberUpdate-${{ steps.version.outputs.version }}.zip
            dist/installer/AntiGrabberUpdate-${{ steps.version.outputs.version }}.zip.sha256
